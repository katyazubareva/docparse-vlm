[project]
name = "docparse-vlm"
version = "0.1.0"
description = "Receipt-to-JSON extraction with a fine-tuned small VLM, benchmarked against OCR+LLM and zero-shot baselines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.49",
    "peft>=0.13",
    "accelerate>=0.34",
    "datasets>=2.20",
]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docparse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
